<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'><title>Falaçao</title><style>body{font-family:'Segoe UI',sans-serif;background-color:#313338;color:white;margin:0;display:flex;height:100vh}.sidebar{width:250px;background-color:#2b2d31;padding:15px;display:flex;flex-direction:column;justify-content:space-between}input{width:100%;box-sizing:border-box;padding:8px;margin-bottom:15px;border-radius:5px;border:none;background-color:#1e1f22;color:white}.canal{background-color:#3f4147;padding:10px;border-radius:5px;cursor:pointer;font-weight:bold}.canal:hover{background-color:#4e5058}.lista-membros{margin-top:8px;padding-left:15px;display:flex;flex-direction:column;gap:6px}.membro{display:flex;align-items:center;gap:8px;font-size:14px;color:#dbdee1;background-color:#232428;padding:6px 10px;border-radius:4px}.bolinha-online{width:8px;height:8px;background-color:#23a55a;border-radius:50%}.controles{display:flex;flex-direction:column;gap:10px}button{padding:10px;border:none;border-radius:5px;cursor:pointer;font-weight:bold;color:white;background-color:#5865f2}button:hover:not(:disabled){background-color:#4752c4}button:disabled{opacity:0.5;cursor:not-allowed}button.perigo{background-color:#da373c}.area-principal{flex:1;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center}.grid-videos{display:flex;flex-wrap:wrap;gap:15px;justify-content:center;width:100%}video{width:480px;max-width:100%;background-color:#1e1f22;border-radius:8px;border:2px solid #5865f2}#debug{font-size:13px;color:#23a55a;margin-top:12px;font-weight:bold}</style></head><body><div class='sidebar'><div><label style='font-size:12px;color:#949ba4;font-weight:bold'>SEU APELIDO</label><input type='text' id='meu-nome' placeholder='Digite seu nome...' value='Jogador'><h3 style='font-size:12px;color:#949ba4'>CANAIS DE VOZ</h3><div class='canal' onclick='entrarNaCall()'>🔊 Geral (Clique para entrar)</div><div class='lista-membros' id='lista-membros'></div></div><div class='controles'><button id='btn-tela' onclick='compartilharTela()' disabled>🖥️ Compartilhar Tela</button><button id='btn-sair' class='perigo' onclick='location.reload()' disabled>❌ Desconectar</button></div></div><div class='area-principal'><h2 id='status'>Digite seu nome e clique em Geral para conectar</h2><div class='grid-videos' id='videos'></div><div id='audios'></div><div id='debug'>Pronto para conectar</div></div><script src='/socket.io/socket.io.js'></script><script>const socket=io(),salaId='sala-geral',conexoes={},candidatos={};let streamLocal=null,streamTela=null;const cfg={iceServers:[{urls:'stun:://google.com'},{urls:'stun:://google.com'}]};function log(t){document.getElementById('debug').innerText=t}async function entrarNaCall(){if(streamLocal)return;try{streamLocal=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});const n=document.getElementById('meu-nome').value.trim()||'Jogador';document.getElementById('meu-nome').disabled=true;document.getElementById('status').innerText='Conectado ao canal Geral';document.getElementById('btn-tela').disabled=false;document.getElementById('btn-sair').disabled=false;log('Microfone ativo! Aguardando outro usuario...');socket.emit('entrar-sala',{salaId,nome:n})}catch(e){alert('Erro microfone: '+e.message)}}socket.on('lista-usuarios',u=>{const l=document.getElementById('lista-membros');l.innerHTML='';for(let id in u){const d=document.createElement('div');d.className='membro';d.innerHTML='<span class="bolinha-online"></span><span>'+u[id]+(id===socket.id?' (Voce)':'')+'</span>';l.appendChild(d)}});socket.on('usuario-conectado',async id=>{log('Iniciando chamada com '+id);const pc=criarPC(id,true);const o=await pc.createOffer();await pc.setLocalDescription(o);socket.emit('sinal-webrtc',{alvo:id,sinal:o})});socket.on('sinal-webrtc',async d=>{const{remetente:r,sinal:s}=d;let pc=conexoes[r]||criarPC(r,false);if(s.type==='offer'){log('Recebendo chamada de '+r);await pc.setRemoteDescription(new RTCSessionDescription(s));const a=await pc.createAnswer();await pc.setLocalDescription(a);socket.emit('sinal-webrtc',{alvo:r,sinal:a});if(candidatos[r]){for(const c of candidatos[r])await pc.addIceCandidate(new RTCIceCandidate(c));delete candidatos[r]}}else if(s.type==='answer'){await pc.setRemoteDescription(new RTCSessionDescription(s))}else if(s.candidate){if(pc.remoteDescription)await pc.addIceCandidate(new RTCIceCandidate(s));else(candidatos[r]=candidatos[r]||[]).push(s)}});socket.on('usuario-desconectado',id=>{if(conexoes[id]){conexoes[id].close();delete conexoes[id]}document.getElementById('video-'+id)?.remove();document.getElementById('audio-'+id)?.remove()});function criarPC(id,ini){const pc=new RTCPeerConnection(cfg);conexoes[id]=pc;if(streamLocal)streamLocal.getTracks().forEach(t=>pc.addTrack(t,streamLocal));if(ini){pc.addTransceiver('video',{direction:'sendrecv'})}pc.oniceconnectionstatechange=()=>log('Conexao P2P: '+pc.iceConnectionState);pc.onicecandidate=e=>{if(e.candidate)socket.emit('sinal-webrtc',{alvo:id,sinal:e.candidate})};pc.ontrack=e=>{if(e.track.kind==='audio'){let a=document.getElementById('audio-'+id);if(!a){a=document.createElement('audio');a.id='audio-'+id;a.autoplay=true;document.getElementById('audios').appendChild(a)}a.srcObject=new MediaStream([e.track]);a.play().catch(()=>{})}if(e.track.kind==='video'){e.track.onunmute=()=>{let v=document.getElementById('video-'+id);if(!v){v=document.createElement('video');v.id='video-'+id;v.autoplay=true;v.playsInline=true;v.muted=true;document.getElementById('videos').appendChild(v)}v.srcObject=new MediaStream([e.track]);v.play().catch(()=>{})}}};return pc}async function compartilharTela(){try{streamTela=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});const tv=streamTela.getVideoTracks().at(0);const mv=document.createElement('video');mv.srcObject=streamTela;mv.autoplay=true;mv.muted=true;document.getElementById('videos').appendChild(mv);for(let id in conexoes){const pc=conexoes[id];const sender=pc.getSenders().find(s=>s.track===null||s.track.kind==='video');if(sender){await sender.replaceTrack(tv);const o=await pc.createOffer();await pc.setLocalDescription(o);socket.emit('sinal-webrtc',{alvo:id,sinal:o})}}}catch(e){log('Erro tela: '+e.message)}}</script></body></html>
