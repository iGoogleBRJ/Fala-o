<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Falaçao - Teste de Conexão</title><style>body{font-family:'Segoe UI',sans-serif;background:#313338;color:#dbdee1;margin:0;display:flex;height:100vh}.sidebar{width:260px;background:#2b2d31;padding:16px;display:flex;flex-direction:column;justify-content:space-between}.box{background:#1e1f22;padding:12px;border-radius:8px;margin-bottom:12px}input{width:100%;box-sizing:border-box;padding:8px;background:#313338;border:1px solid #4e5058;color:white;border-radius:4px;margin-top:6px}button{width:100%;padding:10px;border:none;border-radius:5px;font-weight:bold;color:white;background:#5865f2;cursor:pointer;margin-top:8px}button:disabled{opacity:.4;cursor:not-allowed}button.verde{background:#23a55a}button.vermelho{background:#da373c}.membro{padding:6px 8px;background:#232428;border-radius:4px;margin-top:6px;display:flex;align-items:center;gap:8px}.bolinha{width:8px;height:8px;background:#23a55a;border-radius:50%}.main{flex:1;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-y:auto}.status-bar{background:#1e1f22;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:bold;color:#f0b232;margin-bottom:20px}.videos{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;width:100%}video{width:520px;max-width:100%;background:#000;border-radius:8px;border:2px solid #5865f2}</style></head><body><div class='sidebar'><div><div class='box'><label style='font-size:12px;color:#949ba4'>SEU APELIDO</label><input type='text' id='nome' value='Jogador'><button id='btn-entrar' class='verde' onclick='entrar()'>🔊 Entrar na Fala</button></div><div class='box'><div style='font-size:12px;color:#949ba4'>NA CALL AGORA</div><div id='lista'></div></div></div><div><button id='btn-tela' onclick='compartilharTela()' disabled>🖥️ Compartilhar Tela</button><button id='btn-sair' class='vermelho' onclick='location.reload()' disabled>❌ Sair</button></div></div><div class='main'><div class='status-bar' id='status'>Aguardando você clicar em Entrar na Fala...</div><div class='videos' id='videos'></div><div id='audios'></div></div><script src='/socket.io/socket.io.js'></script><script>const socket=io(),peers={},filaIce={};let meuAudio=null,minhaTela=null;const rtcConfig={iceServers:[{urls:'stun:://google.com'},{urls:'turn:a.relay.metered.ca:80',username:'31d2cc3922618615282905ac',credential:'NCXsWo6o4X5pXfrL'},{urls:'turn:a.relay.metered.ca:443',username:'31d2cc3922618615282905ac',credential:'NCXsWo6o4X5pXfrL'},{urls:'turns:a.relay.metered.ca:443?transport=tcp',username:'31d2cc3922618615282905ac',credential:'NCXsWo6o4X5pXfrL'}]};function setStatus(msg,cor='#f0b232'){const el=document.getElementById('status');el.innerText=msg;el.style.color=cor}async function entrar(){try{setStatus('Pedindo permissão do microfone...');meuAudio=await navigator.mediaDevices.getUserMedia({audio:true,video:false});document.getElementById('btn-entrar').disabled=true;document.getElementById('nome').disabled=true;document.getElementById('btn-tela').disabled=false;document.getElementById('btn-sair').disabled=false;setStatus('Microfone OK! Conectando na sala...','#23a55a');socket.emit('entrar-voz',{nome:document.getElementById('nome').value.trim()||'Jogador'})}catch(e){setStatus('Erro no microfone: '+e.message,'#da373c')}}socket.on('lista-usuarios',u=>{const l=document.getElementById('lista');l.innerHTML='';for(let id in u){l.innerHTML+='<div class="membro"><span class="bolinha"></span><span>'+u[id]+(id===socket.id?' (Você)':'')+'</span></div>'}});socket.on('conectar-peers',async lista=>{if(lista.length===0){setStatus('Você está na sala. Aguardando seu irmão entrar...','#23a55a');return}setStatus('Iniciando chamada com '+lista.length+' pessoa(s)...');for(const id of lista){const pc=criarPeer(id);const offer=await pc.createOffer();await pc.setLocalDescription(offer);socket.emit('sinal-webrtc',{alvo:id,sinal:offer})}});socket.on('sinal-webrtc',async({remetente,sinal})=>{const pc=peers[remetente]||criarPeer(remetente);try{if(sinal.type==='offer'){await pc.setRemoteDescription(new RTCSessionDescription(sinal));const answer=await pc.createAnswer();await pc.setLocalDescription(answer);socket.emit('sinal-webrtc',{alvo:remetente,sinal:answer});if(filaIce[remetente]){for(const c of filaIce[remetente])await pc.addIceCandidate(new RTCIceCandidate(c));delete filaIce[remetente]}}else if(sinal.type==='answer'){await pc.setRemoteDescription(new RTCSessionDescription(sinal));if(filaIce[remetente]){for(const c of filaIce[remetente])await pc.addIceCandidate(new RTCIceCandidate(c));delete filaIce[remetente]}}else if(sinal.candidate){if(pc.remoteDescription)await pc.addIceCandidate(new RTCIceCandidate(sinal));else(filaIce[remetente]=filaIce[remetente]||[]).push(sinal)}}catch(e){setStatus('Erro na sinalização: '+e.message,'#da373c')}});socket.on('peer-saiu',id=>{if(peers[id]){peers[id].close();delete peers[id]}document.getElementById('v-'+id)?.remove();document.getElementById('a-'+id)?.remove()});function criarPeer(id){const pc=new RTCPeerConnection(rtcConfig);peers[id]=pc;if(meuAudio)meuAudio.getTracks().forEach(t=>pc.addTrack(t,meuAudio));if(minhaTela)minhaTela.getTracks().forEach(t=>pc.addTrack(t,minhaTela));pc.oniceconnectionstatechange=()=>{const st=pc.iceConnectionState;if(st==='connected'||st==='completed')setStatus('CONECTADO! Áudio e Vídeo ativos ('+st+')','#23a55a');else if(st==='failed'||st==='disconnected')setStatus('Falha na rede P2P ('+st+'). Tentando reconectar...','#da373c');else setStatus('Negociando rede: '+st+'...')};pc.onicecandidate=e=>{if(e.candidate)socket.emit('sinal-webrtc',{alvo:id,sinal:e.candidate})};pc.ontrack=e=>{if(e.track.kind==='audio'){let a=document.getElementById('a-'+id);if(!a){a=document.createElement('audio');a.id='a-'+id;a.autoplay=true;document.getElementById('audios').appendChild(a)}a.srcObject=new MediaStream([e.track]);a.play().catch(()=>setStatus('Clique em qualquer lugar da tela para liberar o som!','#f0b232'))}if(e.track.kind==='video'){let v=document.getElementById('v-'+id);if(!v){v=document.createElement('video');v.id='v-'+id;v.autoplay=true;v.playsInline=true;v.muted=true;document.getElementById('videos').appendChild(v)}v.srcObject=new MediaStream([e.track]);v.play().catch(()=>{})}};return pc}async function compartilharTela(){try{minhaTela=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});const track=minhaTela.getVideoTracks().at(0);const meuV=document.createElement('video');meuV.srcObject=minhaTela;meuV.autoplay=true;meuV.muted=true;document.getElementById('videos').appendChild(meuV);for(let id in peers){const pc=peers[id];pc.addTrack(track,minhaTela);const offer=await pc.createOffer();await pc.setLocalDescription(offer);socket.emit('sinal-webrtc',{alvo:id,sinal:offer})}}catch(e){setStatus('Erro ao compartilhar tela: '+e.message,'#da373c')}}document.body.addEventListener('click',()=>document.querySelectorAll('audio').forEach(a=>a.play().catch(()=>{})));</script></body></html>
