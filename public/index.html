<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Falaçao</title><style>*{box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#313338;color:#dbdee1;margin:0;display:flex;height:100vh;overflow:hidden}.servers-bar{width:72px;background:#1e1f22;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:10px;flex-shrink:0;overflow-y:auto}.srv-btn{width:48px;height:48px;background:#313338;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#dbdee1;font-size:18px;cursor:pointer;transition:.2s;border:none;flex-shrink:0}.srv-btn:hover,.srv-btn.active{background:#5865f2;border-radius:16px;color:white}.srv-add{background:#313338;color:#23a55a;font-size:24px}.srv-add:hover{background:#23a55a;color:white;border-radius:16px}.divider{width:32px;height:2px;background:#35363c;flex-shrink:0}.channels-bar{width:245px;background:#2b2d31;display:flex;flex-direction:column;justify-content:space-between;flex-shrink:0}.server-header{height:48px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-weight:bold;color:white;border-bottom:1px solid #1f2023}.hdr-actions{display:flex;gap:6px}.mini-hdr-btn{background:#35373c;border:none;color:#dbdee1;border-radius:4px;padding:4px 7px;cursor:pointer;font-size:12px}.mini-hdr-btn:hover{background:#5865f2;color:white}.channels-list{padding:10px 8px;flex:1;overflow-y:auto}.folder{margin-bottom:12px}.folder-hdr{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:bold;color:#949ba4;padding:4px 6px;cursor:pointer;user-select:none}.folder-hdr:hover{color:white}.add-ch-btn{background:none;border:none;color:#949ba4;font-size:15px;cursor:pointer;padding:0 4px}.add-ch-btn:hover{color:white}.channel-item{padding:7px 10px;border-radius:5px;cursor:pointer;color:#949ba4;font-weight:500;display:flex;align-items:center;gap:8px;margin-top:2px;font-size:14px}.channel-item:hover,.channel-item.active{background:#3f4147;color:white}.voice-members{padding-left:20px;display:flex;flex-direction:column;gap:3px;margin-top:3px}.voice-member{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;border-radius:4px;font-size:13px}.member-left{display:flex;align-items:center;gap:8px}.mini-avatar{width:22px;height:22px;border-radius:50%;background:#5865f2;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;color:white;border:2px solid transparent}.speaking{border-color:#23a55a!important;box-shadow:0 0 8px #23a55a}.user-panel{background:#232428;padding:10px;display:flex;flex-direction:column;gap:6px}.conn-bar{font-size:12px;color:#23a55a;font-weight:bold;display:none;justify-content:space-between;border-bottom:1px solid #2e3035;padding-bottom:5px}.user-controls{display:flex;align-items:center;justify-content:space-between;gap:4px}.name-input{background:#1e1f22;border:1px solid #383a40;color:white;padding:6px 8px;border-radius:4px;width:120px;font-size:13px;font-weight:bold}.icon-btn{background:transparent;border:none;color:#b5bac1;cursor:pointer;padding:6px;border-radius:4px;font-size:16px}.muted{color:#f23f43!important}.stage-area{flex:1;background:#1e1f22;display:flex;flex-direction:column;min-width:0}.stage-header{height:48px;background:#313338;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1f2023}.cards-grid{flex:1;padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center;overflow-y:auto}.user-card{width:220px;height:140px;background:#2b2d31;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;border:2px solid transparent}.big-avatar{width:60px;height:60px;border-radius:50%;background:#5865f2;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;color:white}.card-name{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,0.65);padding:3px 8px;border-radius:4px;font-size:13px;color:white}.video-box{position:relative;display:flex;flex-direction:column;align-items:center}video{width:520px;max-width:100%;background:#000;border-radius:10px;border:2px solid #5865f2}.video-label{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.7);padding:3px 8px;border-radius:4px;font-size:12px;color:white}.call-actions{height:68px;background:#2b2d31;display:flex;align-items:center;justify-content:center;gap:16px}.action-circle{width:48px;height:48px;border-radius:50%;border:none;background:#35373c;color:white;font-size:20px;cursor:pointer}.action-circle:disabled{opacity:.4;cursor:not-allowed}.danger{background:#da373c!important}.active-green{background:#23a55a!important}.chat-bar{width:280px;background:#313338;border-left:1px solid #1f2023;display:flex;flex-direction:column;flex-shrink:0}.chat-messages{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}.msg-author{font-weight:bold;color:white;font-size:13px}.msg-time{font-size:11px;color:#949ba4;margin-left:6px}.msg-text{font-size:14px;color:#dbdee1;word-break:break-word;margin-top:2px}.chat-input-box{padding:12px}.chat-input{width:100%;background:#383a40;border:none;padding:10px;border-radius:8px;color:white;outline:none}</style></head><body><div class='servers-bar' id='servers-bar'><button class='srv-btn active' id='srv-btn-geral' onclick="selecionarServidor('geral','Falaçao Oficial')" title='Falaçao Oficial'>F</button><div class='divider'></div><button class='srv-btn srv-add' onclick='novoServidor()' title='Criar Servidor'>+</button><button class='srv-btn' onclick='entrarPorCodigo()' title='Entrar com Código'>🔗</button></div><div class='channels-bar'><div><div class='server-header'><span id='srv-titulo'>Falaçao Oficial</span><div class='hdr-actions'><button class='mini-hdr-btn' onclick='novaPasta()' title='Nova Pasta/Categoria'>📁+</button><button class='mini-hdr-btn' onclick='copiarConvite()' title='Copiar Código do Servidor'>🔗</button></div></div><div class='channels-list' id='folders-list'></div></div><div class='user-panel'><div class='conn-bar' id='conn-bar'><span>📶 Voz Conectada</span><span id='nome-canal-ativo'>Geral</span></div><div class='user-controls'><input type='text' id='meu-nome' class='name-input' value='Jogador' placeholder='Apelido' onchange='atualizarApelido()'><div><button class='icon-btn' id='btn-mute-mini' onclick='alternarMudo()' disabled>🎤</button><button class='icon-btn' id='btn-deaf-mini' onclick='alternarSurdo()' disabled>🎧</button></div></div></div></div><div class='stage-area'><div class='stage-header'><b id='stage-titulo'>🔊 Selecione um canal de voz</b><span id='debug' style='font-size:12px;color:#949ba4'>Online</span></div><div class='cards-grid' id='stage-grid'><div style='text-align:center;color:#949ba4'><h3>Crie seu Servidor ou entre em um Canal</h3><p>Clique no <b>+</b> na barra esquerda para criar um servidor, ou em <b>📁+</b> para criar pastas de canais.</p></div></div><div id='audios'></div><div class='call-actions'><button class='action-circle' id='btn-mute' onclick='alternarMudo()' title='Mutar' disabled>🎤</button><button class='action-circle' id='btn-tela' onclick='compartilharTela()' title='Compartilhar / Parar Tela' disabled>🖥️</button><button class='action-circle danger' id='btn-sair' onclick='sairDaVoz()' title='Desconectar da Voz' disabled>📞</button></div></div><div class='chat-bar'><div class='stage-header'><b id='chat-titulo'>💬 #bate-papo</b></div><div class='chat-messages' id='chat-messages'></div><div class='chat-input-box'><input type='text' id='chat-input' class='chat-input' placeholder='Enviar mensagem...' onkeypress='enviarMensagem(event)'></div></div><script src='/socket.io/socket.io.js'></script><script>const socket=io();let srvAtual='geral',canalVozAtual=null,canalTxtAtual='bate-papo',conexoes={},candidatos={},streamLocal=null,streamTela=null,mutado=false,surdo=false,membrosAtuais={},pastasAbertas={p1:true,p2:true};const cfg={iceServers:[{urls:'stun:://google.com'},{urls:'turn:a.relay.metered.ca:80',username:'31d2cc3922618615282905ac',credential:'NCXsWo6o4X5pXfrL'},{urls:'turn:a.relay.metered.ca:443',username:'31d2cc3922618615282905ac',credential:'NCXsWo6o4X5pXfrL'}]};socket.on('connect',()=>selecionarServidor('geral','Falaçao Oficial'));function novoServidor(){const nome=prompt('Nome do novo servidor:');if(!nome)return;socket.emit('criar-servidor',{nome,apelido:getApelido()})}socket.on('servidor-criado',srv=>{adicionarBotaoSrv(srv.id,srv.nome);selecionarServidor(srv.id,srv.nome);alert('Servidor criado! Código de convite para amigos: '+srv.id)});function entrarPorCodigo(){const cod=prompt('Cole o código do servidor (ex: srv-1234):');if(!cod)return;const id=cod.trim();adicionarBotaoSrv(id,id.toUpperCase());selecionarServidor(id,id)}function adicionarBotaoSrv(id,nome){if(document.getElementById('srv-btn-'+id))return;const bar=document.getElementById('servers-bar'),btn=document.createElement('button');btn.className='srv-btn';btn.id='srv-btn-'+id;btn.innerText=nome.charAt(0).toUpperCase();btn.title=nome+' ('+id+')';btn.onclick=()=>selecionarServidor(id,nome);bar.insertBefore(btn,bar.querySelector('.divider'))}function selecionarServidor(id,nome){sairDaVoz(true);srvAtual=id;document.querySelectorAll('.srv-btn').forEach(b=>b.classList.remove('active'));document.getElementById('srv-btn-'+id)?.classList.add('active');document.getElementById('srv-titulo').innerText=nome;document.getElementById('chat-messages').innerHTML='';socket.emit('entrar-servidor',{srvId:id,apelido:getApelido()})}function copiarConvite(){prompt('Copie e mande este código para seus amigos entrarem no seu servidor:',srvAtual)}function getApelido(){return document.getElementById('meu-nome').value.trim()||'Jogador'}function atualizarApelido(){socket.emit('entrar-servidor',{srvId:srvAtual,apelido:getApelido()})}function novaPasta(){const nomePasta=prompt('Nome da nova pasta/categoria (ex: SQUAD):');if(nomePasta)socket.emit('criar-pasta',{srvId:srvAtual,nomePasta})}function novoCanal(pastaId,e){e.stopPropagation();const nomeCanal=prompt('Nome do novo canal:');if(!nomeCanal)return;const tipo=confirm('Clique em OK para canal de VOZ (🔊) ou Cancelar para canal de TEXTO (#)')?'voz':'texto';socket.emit('criar-canal',{srvId:srvAtual,pastaId,nomeCanal,tipo})}socket.on('estado-servidor',({servidor,membros})=>{membrosAtuais=membros;document.getElementById('srv-titulo').innerText=servidor.nome;const list=document.getElementById('folders-list'),stage=document.getElementById('stage-grid');list.innerHTML='';if(canalVozAtual&&!document.querySelector('video'))stage.innerHTML='';servidor.pastas.forEach(p=>{if(pastasAbertas[p.id]===undefined)pastasAbertas[p.id]=true;const fDiv=document.createElement('div');fDiv.className='folder';const seta=pastasAbertas[p.id]?'▼':'▶';fDiv.innerHTML='<div class="folder-hdr" onclick="togglePasta(\''+p.id+'\')"><span>'+seta+' '+p.nome+'</span><button class="add-ch-btn" onclick="novoCanal(\''+p.id+'\',event)" title="Criar Canal na Pasta">+</button></div>';if(pastasAbertas[p.id]){p.canais.forEach(c=>{const ch=document.createElement('div');ch.className='channel-item'+((c.tipo==='voz'&&canalVozAtual===c.id)||(c.tipo==='texto'&&canalTxtAtual===c.nome)?' active':'');ch.innerHTML=(c.tipo==='voz'?'🔊 ':'# ')+c.nome;ch.onclick=()=>c.tipo==='voz'?entrarVoz(c.id,c.nome):abrirTexto(c.nome);fDiv.appendChild(ch);if(c.tipo==='voz'){const vm=document.createElement('div');vm.className='voice-members';for(let uid in membros){if(membros[uid].canalId===c.id){const u=membros[uid],ini=u.nome.charAt(0).toUpperCase(),m=u.mutado?'🔇':'';const row=document.createElement('div');row.className='voice-member';row.innerHTML='<div class="member-left"><div class="mini-avatar" id="mini-av-'+uid+'">'+ini+'</div><span>'+u.nome+'</span></div><span>'+m+'</span>';vm.appendChild(row);if(canalVozAtual===c.id&&!document.querySelector('video')){const card=document.createElement('div');card.className='user-card';card.id='card-'+uid;card.innerHTML='<div class="big-avatar">'+ini+'</div><div class="card-name">'+m+' '+u.nome+'</div>';stage.appendChild(card)}}}fDiv.appendChild(vm)}})}list.appendChild(fDiv)})});function togglePasta(pid){pastasAbertas[pid]=!pastasAbertas[pid];socket.emit('entrar-servidor',{srvId:srvAtual,apelido:getApelido()})}function abrirTexto(nome){canalTxtAtual=nome;document.getElementById('chat-titulo').innerText='💬 #'+nome;document.getElementById('chat-messages').innerHTML=''}async function entrarVoz(cid,cnome){if(canalVozAtual===cid)return;try{if(!streamLocal){streamLocal=await navigator.mediaDevices.getUserMedia({audio:true,video:false});monitorarVoz(streamLocal,socket.id)}canalVozAtual=cid;document.getElementById('conn-bar').style.display='flex';document.getElementById('nome-canal-ativo').innerText=cnome;document.getElementById('stage-titulo').innerText='🔊 '+cnome;['btn-mute','btn-mute-mini','btn-deaf-mini','btn-tela','btn-sair'].forEach(i=>document.getElementById(i).disabled=false);socket.emit('entrar-voz',{srvId:srvAtual,canalId:cid})}catch(e){alert('Permita o microfone: '+e.message)}}function sairDaVoz(silencioso){pararTela();for(let id in conexoes){conexoes[id].close();delete conexoes[id]}document.getElementById('audios').innerHTML='';document.getElementById('stage-grid').innerHTML='';canalVozAtual=null;document.getElementById('conn-bar').style.display='none';document.getElementById('stage-titulo').innerText='🔊 Selecione um canal de voz';['btn-mute','btn-mute-mini','btn-deaf-mini','btn-tela','btn-sair'].forEach(i=>document.getElementById(i).disabled=true);if(!silencioso)socket.emit('sair-voz',{srvId:srvAtual})}function alternarMudo(){if(!streamLocal)return;mutado=!mutado;streamLocal.getAudioTracks().forEach(t=>t.enabled=!mutado);document.getElementById('btn-mute').innerText=mutado?'🔇':'🎤';document.getElementById('btn-mute-mini').innerText=mutado?'🔇':'🎤';document.getElementById('btn-mute').classList.toggle('danger',mutado);document.getElementById('btn-mute-mini').classList.toggle('muted',mutado);socket.emit('status-mudo',{srvId:srvAtual,mutado})}function alternarSurdo(){surdo=!surdo;document.querySelectorAll('audio').forEach(a=>a.muted=surdo);document.getElementById('btn-deaf-mini').innerText=surdo?'🔕':'🎧';document.getElementById('btn-deaf-mini').classList.toggle('muted',surdo)}function enviarMensagem(e){if(e.key==='Enter'&&e.target.value.trim()){socket.emit('mensagem-chat',{srvId:srvAtual,canalTxt:canalTxtAtual,texto:e.target.value.trim()});e.target.value=''}}socket.on('nova-mensagem',({canalTxt,autor,texto,hora})=>{if(canalTxt!==canalTxtAtual)return;const b=document.getElementById('chat-messages'),d=document.createElement('div');d.innerHTML='<div><span class="msg-author">'+autor+'</span><span class="msg-time">'+hora+'</span></div><div class="msg-text">'+texto+'</div>';b.appendChild(d);b.scrollTop=b.scrollHeight});function monitorarVoz(st,uid){try{const cx=new AudioContext(),sr=cx.createMediaStreamSource(st),an=cx.createAnalyser();an.fftSize=256;sr.connect(an);const dt=new Uint8Array(an.frequencyBinCount);setInterval(()=>{an.getByteFrequencyData(dt);let sm=0;for(let i=0;i<dt.length;i++)sm+=dt[i];const f=(sm/dt.length)>14&&!(membrosAtuais[uid]?.mutado);document.getElementById('mini-av-'+uid)?.classList.toggle('speaking',f);document.getElementById('card-'+uid)?.classList.toggle('speaking',f)},100)}catch(e){}}socket.on('conectar-com-lista',async lista=>{document.getElementById('debug').innerText='Conectando a '+lista.length+' pessoa(s)...';for(const id of lista){const pc=criarPC(id,true),o=await pc.createOffer();await pc.setLocalDescription(o);socket.emit('sinal-webrtc',{alvo:id,sinal:o})}});socket.on('sinal-webrtc',async d=>{const{remetente:r,sinal:s}=d;let pc=conexoes[r]||criarPC(r,false);if(s.type==='offer'){await pc.setRemoteDescription(new RTCSessionDescription(s));const a=await pc.createAnswer();await pc.setLocalDescription(a);socket.emit('sinal-webrtc',{alvo:r,sinal:a});if(candidatos[r]){for(const c of candidatos[r])await pc.addIceCandidate(new RTCIceCandidate(c));delete candidatos[r]}}else if(s.type==='answer')await pc.setRemoteDescription(new RTCSessionDescription(s));else if(s.candidate){if(pc.remoteDescription)await pc.addIceCandidate(new RTCIceCandidate(s));else(candidatos[r]=candidatos[r]||[]).push(s)}});socket.on('usuario-desconectado',id=>{if(conexoes[id]){conexoes[id].close();delete conexoes[id]}document.getElementById('vbox-'+id)?.remove();document.getElementById('audio-'+id)?.remove();document.getElementById('card-'+id)?.remove()});socket.on('remover-tela',id=>document.getElementById('vbox-'+id)?.remove());function criarPC(id,ini){const pc=new RTCPeerConnection(cfg);conexoes[id]=pc;if(streamLocal)streamLocal.getTracks().forEach(t=>pc.addTrack(t,streamLocal));if(ini)pc.addTransceiver('video',{direction:'sendrecv'});pc.oniceconnectionstatechange=()=>document.getElementById('debug').innerText='P2P: '+pc.iceConnectionState;pc.onicecandidate=e=>{if(e.candidate)socket.emit('sinal-webrtc',{alvo:id,sinal:e.candidate})};pc.ontrack=e=>{if(e.track.kind==='audio'){const sa=new MediaStream([e.track]);let a=document.getElementById('audio-'+id);if(!a){a=document.createElement('audio');a.id='audio-'+id;a.autoplay=true;a.muted=surdo;document.getElementById('audios').appendChild(a)}a.srcObject=sa;a.play().catch(()=>{});monitorarVoz(sa,id)}if(e.track.kind==='video'){e.track.onunmute=()=>{let vb=document.getElementById('vbox-'+id);if(!vb){vb=document.createElement('div');vb.className='video-box';vb.id='vbox-'+id;const dn=membrosAtuais[id]?.nome||'Amigo';vb.innerHTML='<span class="video-label">🖥️ Tela de '+dn+'</span>';const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.muted=true;v.srcObject=new MediaStream([e.track]);vb.appendChild(v);document.getElementById('stage-grid').appendChild(vb);v.play().catch(()=>{})}}}};return pc}function pararTela(){if(streamTela){streamTela.getTracks().forEach(t=>t.stop());streamTela=null}document.getElementById('vbox-local')?.remove();document.getElementById('btn-tela')?.classList.remove('active-green');socket.emit('parou-tela',{srvId:srvAtual})}async function compartilharTela(){if(streamTela){pararTela();return}try{streamTela=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});const tv=streamTela.getVideoTracks().at(0);tv.onended=()=>pararTela();document.getElementById('btn-tela').classList.add('active-green');const vb=document.createElement('div');vb.className='video-box';vb.id='vbox-local';vb.innerHTML='<span class="video-label">🖥️ Sua Tela</span>';const mv=document.createElement('video');mv.srcObject=streamTela;mv.autoplay=true;mv.muted=true;vb.appendChild(mv);document.getElementById('stage-grid').appendChild(vb);for(let id in conexoes){const pc=conexoes[id],sd=pc.getSenders().find(s=>s.track===null||s.track.kind==='video');if(sd){await sd.replaceTrack(tv);const o=await pc.createOffer();await pc.setLocalDescription(o);socket.emit('sinal-webrtc',{alvo:id,sinal:o})}}}catch(e){}}</script></body></html>
